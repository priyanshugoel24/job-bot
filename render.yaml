services:
  - type: web
    name: jobbot-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 "dashboard.app:app"
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set manually in Render dashboard → Environment
      - key: SYNC_SECRET
        sync: false   # any password you choose — protects the /api/sync upload endpoint
      - key: FLASK_DEBUG
        value: "0"
