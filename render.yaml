services:
  - type: web
    name: jobbot-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 "dashboard.app:app"
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: FLASK_DEBUG
        value: "0"
      - key: OUTPUT_DIR
        value: /data/output  # points to the persistent disk below
    disk:
      name: job-data
      mountPath: /data
      sizeGB: 1
